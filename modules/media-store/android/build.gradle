plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.allaith.pitchblack.mediastore'
version = '0.1.0'

android {
  namespace "com.allaith.pitchblack.mediastore"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}
